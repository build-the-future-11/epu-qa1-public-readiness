name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-review:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned Ruff
        run: >-
          python -m pip install
          --disable-pip-version-check --no-input ruff==0.15.20
      - name: Lint mutable public code
        run: >-
          ruff check --select E9,F,B,C4,PIE,RUF,PERF
          public_preflight.py candidate auditor
      - name: Run bounded public verification
        run: >-
          python -B public_preflight.py
          --output verification/ci-${{ matrix.python-version }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: verification-${{ matrix.python-version }}
          path: verification/ci-${{ matrix.python-version }}/RECEIPT.json
          if-no-files-found: error
          retention-days: 14

